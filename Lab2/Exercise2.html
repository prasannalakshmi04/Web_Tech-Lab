<!DOCTYPE html>
<html>
<head>
<title>Media</title>
</head>
<body>

<h2>Audio Player</h2>
<audio id="a" controls>
<source src="audio.mp3">
</audio>
<p id="at"></p>

<h2>Video Player</h2>
<video id="v" width="400" controls>
<source src="video.mp4">
</video>
<p id="vt"></p>

<script>
setInterval(function(){
document.getElementById("at").innerHTML="Audio Time: "+Math.floor(document.getElementById("a").currentTime)+"s";
document.getElementById("vt").innerHTML="Video Time: "+Math.floor(document.getElementById("v").currentTime)+"s";
},500);
</script>

</body>
</html>
