<!DOCTYPE html>
<html>
<head>
    <title>Library Book Tracker</title>
    <style>
        body { font-family: Arial; }
        table { border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid black; padding: 8px; }
        .error { color: red; }
    </style>
</head>
<body>

<h2>Library Book Tracker</h2>

<button onclick="loadXML()">Load Books</button>

<h3>Add Book</h3>
<input type="text" id="bid" placeholder="Book ID">
<input type="text" id="title" placeholder="Title">
<input type="text" id="author" placeholder="Author">
<input type="text" id="status" placeholder="Status (Available/Not Available)">
<button onclick="addBook()">Add</button>

<div id="message"></div>
<table id="bookTable"></table>

<script>

let xmlDoc; // will store XML document

// LOAD XML USING AJAX
function loadXML() {

    fetch("books.xml")
    .then(response => response.text())
    .then(str => new DOMParser().parseFromString(str, "text/xml"))
    .then(data => {
        xmlDoc = data;
        displayBooks();
    })
    .catch(() => {
        document.getElementById("message").innerHTML = "Error loading XML";
    });
}

// DISPLAY BOOKS IN TABLE
function displayBooks() {

    let books = xmlDoc.getElementsByTagName("book");
    let table = document.getElementById("bookTable");

    table.innerHTML = `
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Status</th>
        <th>Action</th>
    </tr>`;

    for(let i = 0; i < books.length; i++) {

        let id = books[i].getElementsByTagName("id")[0].textContent;
        let title = books[i].getElementsByTagName("title")[0].textContent;
        let author = books[i].getElementsByTagName("author")[0].textContent;
        let status = books[i].getElementsByTagName("status")[0].textContent;

        table.innerHTML += `
        <tr>
            <td>${id}</td>
            <td>${title}</td>
            <td>${author}</td>
            <td>${status}</td>
            <td>
                <button onclick="deleteBook(${i})">Delete</button>
                <button onclick="toggleStatus(${i})">Toggle Status</button>
            </td>
        </tr>`;
    }
}

// ADD NEW BOOK NODE USING XML DOM
function addBook() {

    let id = document.getElementById("bid").value;
    let title = document.getElementById("title").value;
    let author = document.getElementById("author").value;
    let status = document.getElementById("status").value;

    if(id === "" || title === "" || author === "" || status === "") {
        alert("Fill all fields");
        return;
    }

    let book = xmlDoc.createElement("book");

    let idNode = xmlDoc.createElement("id");
    idNode.appendChild(xmlDoc.createTextNode(id));

    let titleNode = xmlDoc.createElement("title");
    titleNode.appendChild(xmlDoc.createTextNode(title));

    let authorNode = xmlDoc.createElement("author");
    authorNode.appendChild(xmlDoc.createTextNode(author));

    let statusNode = xmlDoc.createElement("status");
    statusNode.appendChild(xmlDoc.createTextNode(status));

    book.appendChild(idNode);
    book.appendChild(titleNode);
    book.appendChild(authorNode);
    book.appendChild(statusNode);

    xmlDoc.getElementsByTagName("library")[0].appendChild(book);

    displayBooks();
}

// DELETE BOOK NODE
function deleteBook(index) {

    let books = xmlDoc.getElementsByTagName("book");
    let library = xmlDoc.getElementsByTagName("library")[0];

    library.removeChild(books[index]);

    displayBooks();
}

// UPDATE AVAILABILITY STATUS
function toggleStatus(index) {

    let books = xmlDoc.getElementsByTagName("book");
    let statusNode = books[index].getElementsByTagName("status")[0];

    if(statusNode.textContent === "Available")
        statusNode.textContent = "Not Available";
    else
        statusNode.textContent = "Available";

    displayBooks();
}

</script>

</body>
</html>
