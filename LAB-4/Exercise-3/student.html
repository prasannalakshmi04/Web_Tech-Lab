<h2>Student Management</h2>

<input type="text" id="id" placeholder="ID">
<input type="text" id="name" placeholder="Name">
<input type="text" id="dept" placeholder="Department">
<input type="number" id="marks" placeholder="Marks">
<button onclick="addStudent()">Add</button>

<table border="1" id="table">
<tr>
<th>ID</th><th>Name</th><th>Dept</th><th>Marks</th><th>Action</th>
</tr>
</table>

<script>
let students = [];

function addStudent() {

    let idVal = document.getElementById("id").value;
    let nameVal = document.getElementById("name").value;
    let deptVal = document.getElementById("dept").value;
    let marksVal = document.getElementById("marks").value;

    if(idVal === "" || nameVal === "" || deptVal === "" || marksVal === "") {
        alert("Please fill all fields");
        return;
    }

    let student = {
        id: idVal,
        name: nameVal,
        dept: deptVal,
        marks: marksVal
    };

    students.push(student);
    displayStudents();

    // Clear fields after adding
    document.getElementById("id").value = "";
    document.getElementById("name").value = "";
    document.getElementById("dept").value = "";
    document.getElementById("marks").value = "";
}

function displayStudents() {
    let table = document.getElementById("table");

    table.innerHTML = `
    <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Dept</th>
    <th>Marks</th>
    <th>Action</th>
    </tr>`;

    students.forEach((s, index) => {
        table.innerHTML += `
        <tr>
        <td>${s.id}</td>
        <td>${s.name}</td>
        <td>${s.dept}</td>
        <td>${s.marks}</td>
        <td>
        <button onclick="deleteStudent(${index})">Delete</button>
        </td>
        </tr>`;
    });
}

function deleteStudent(index) {
    students.splice(index, 1);
    displayStudents();
}
</script>
