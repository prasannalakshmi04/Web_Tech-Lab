<input type="text" id="city" placeholder="Enter city">
<button onclick="getWeather()">Get Weather</button>
<div id="weather"></div>

<script>
let cache = {};

function getWeather() {
    let city = document.getElementById("city").value;
    let weatherDiv = document.getElementById("weather");

    if(cache[city]) {
        weatherDiv.innerHTML = cache[city];
        return;
    }

    weatherDiv.innerHTML = "Loading...";

    fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=8e95eaa82d6ea4f3500b5bddc57491cf&units=metric`)
        .then(res => {
            if(!res.ok) throw new Error("City not found");
            return res.json();
        })
        .then(data => {
            let output = `
                Temperature: ${data.main.temp}°C<br>
                Humidity: ${data.main.humidity}%<br>
                Condition: ${data.weather[0].description}
            `;
            cache[city] = output;
            weatherDiv.innerHTML = output;
        })
        .catch(err => {
            weatherDiv.innerHTML = err.message;
        });
}
</script>
