<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Workflow Engine</title>
    <style>
        :root { --primary: #4f46e5; --error: #ef4444; --bg: #f9fafb; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 40px; }
        .wrapper { background: white; width: 400px; padding: 2rem; border-radius: 12px; shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: 1px solid #e5e7eb; }
        
        /* Progress UI */
        .progress-track { height: 6px; background: #e5e7eb; border-radius: 10px; margin-bottom: 2rem; overflow: hidden; }
        #progress-fill { height: 100%; width: 25%; background: var(--primary); transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

        .step-panel { display: none; }
        .step-panel.active { display: block; animation: fadeIn 0.3s ease; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .field { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.875rem; font-weight: 600; color: #374151; margin-bottom: 0.5rem; }
        input { width: 100%; padding: 0.6rem; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        input:focus { outline: 2px solid var(--primary); border-color: transparent; }
        
        .error-hint { color: var(--error); font-size: 0.75rem; margin-top: 0.4rem; display: none; }
        .invalid input { border-color: var(--error); }
        .invalid .error-hint { display: block; }

        .footer { margin-top: 2rem; display: flex; justify-content: space-between; }
        button { padding: 0.6rem 1.2rem; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-next { background: var(--primary); color: white; }
        .btn-prev { background: #f3f4f6; color: #374151; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="progress-track"><div id="progress-fill"></div></div>
    <h2 id="step-label" style="font-size: 1.1rem; margin-bottom: 1.5rem;">Step 1: Identity</h2>

    <form id="workflow-engine">
        <div class="step-panel active" data-step="1">
            <div class="field">
                <label>Username</label>
                <input type="text" id="username" placeholder="e.g. jdoe">
                <div class="error-hint">Required (min 4 characters).</div>
            </div>
        </div>

        <div class="step-panel" data-step="2">
            <div class="field">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="hello@example.com">
                <div class="error-hint">Please enter a valid email.</div>
            </div>
        </div>

        <div class="field step-panel" data-step="3">
            <label>Theme Choice</label>
            <input type="text" id="theme" placeholder="Light or Dark">
            <div class="error-hint">Enter 'Light' or 'Dark'.</div>
        </div>

        <div class="step-panel" data-step="4">
            <div id="summary" style="background: #f9fafb; padding: 1rem; border-radius: 8px; font-size: 0.9rem; line-height: 1.6;"></div>
        </div>

        <div class="footer">
            <button type="button" class="btn-prev" id="prevBtn" onclick="navigate(-1)" disabled>Back</button>
            <button type="button" class="btn-next" id="nextBtn" onclick="navigate(1)">Next</button>
        </div>
    </form>
</div>

<script>
    // 1 & 6. State Management
    let currentStep = 1;
    const formData = { username: "", email: "", theme: "" };

    const panels = document.querySelectorAll('.step-panel');
    const fill = document.getElementById('progress-fill');
    const nextBtn = document.getElementById('nextBtn');
    const prevBtn = document.getElementById('prevBtn');

    // 2 & 5. Navigation & Validation Engine
    function navigate(direction) {
        // If going forward, validate the current screen first
        if (direction === 1 && !isCurrentStepValid()) return;

        currentStep += direction;

        if (currentStep > 4) {
            alert("Workflow Complete! Data logged to console.");
            console.table(formData);
            return;
        }

        syncUI();
    }

    function isCurrentStepValid() {
        let valid = true;
        
        if (currentStep === 1) {
            const el = document.getElementById('username');
            valid = el.value.trim().length >= 4;
            updateFieldUI(el, valid);
            if (valid) formData.username = el.value;
        } 
        else if (currentStep === 2) {
            const el = document.getElementById('email');
            valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el.value);
            updateFieldUI(el, valid);
            if (valid) formData.email = el.value;
        } 
        else if (currentStep === 3) {
            const el = document.getElementById('theme');
            const val = el.value.toLowerCase();
            valid = val === 'light' || val === 'dark';
            updateFieldUI(el, valid);
            if (valid) formData.theme = val;
        }

        return valid;
    }

    function updateFieldUI(el, isValid) {
        el.parentElement.classList.toggle('invalid', !isValid);
    }

    // 3 & 4. DOM Manipulation
    function syncUI() {
        // Toggle Panel Visibility
        panels.forEach(p => p.classList.toggle('active', p.dataset.step == currentStep));

        // Update Progress Bar
        fill.style.width = `${(currentStep / 4) * 100}%`;

        // Update Button States
        prevBtn.disabled = currentStep === 1;
        nextBtn.innerText = currentStep === 4 ? "Submit" : "Next";
        
        // Update Label
        const titles = ["Identity", "Contact", "Preferences", "Review"];
        document.getElementById('step-label').innerText = `Step ${currentStep}: ${titles[currentStep-1]}`;

        if (currentStep === 4) showSummary();
    }

    function showSummary() {
        document.getElementById('summary').innerHTML = `
            <strong>User:</strong> ${formData.username}<br>
            <strong>Email:</strong> ${formData.email}<br>
            <strong>Theme:</strong> ${formData.theme}
        `;
    }
</script>
</body>
</html>
